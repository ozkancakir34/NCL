<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juinor Eurovision Song Contest 2025</title>
  <style>
    :root { --green:#25D366; --dark:#075E54; --bg:#0b141a; --card:#111b21; --text:#e9edef; --muted:#9aa5ae; --border:#1f2c33 }
    :root[data-theme="light"] { --bg:#f5f6f7; --card:#ffffff; --text:#111b21; --muted:#5c6b7a; --border:#e5e7ea; --dark:#0b7b6f }
    * { box-sizing:border-box }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
    header { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; padding:20px; border-bottom:1px solid var(--border); background:rgba(7,94,84,0.08) }
    header h1 { margin:0; font-size:18px; letter-spacing:0.2px }
    .brand { display:flex; align-items:center; gap:12px }
    .controls { display:flex; gap:10px; align-items:center; justify-self:end }
    select { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; outline:none }
    .tag { font-size:12px; color:var(--muted) }
    main { padding:20px }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px }
    .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:10px; transition:transform .15s ease, box-shadow .15s ease }
    .card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.35) }
    .top { display:flex; align-items:center; justify-content:space-between }
    .name { font-weight:600; font-size:16px }
    .role { font-size:13px; color:var(--muted) }
    .company { font-size:13px; color:var(--muted) }
    .row { display:flex; gap:8px; align-items:center; font-size:13px; flex-wrap:wrap }
    .pill { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; border:1px solid var(--border); color:var(--text) }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 14px; border-radius:999px; border:0; background:var(--green); color:#042116; font-weight:600; cursor:pointer }
    .btn:active { transform:scale(.99) }
    .btn.alt { background:transparent; color:var(--text); border:1px solid var(--border) }
    .btn.small { padding:6px 8px; font-size:12px }
    .btn[aria-disabled="true"] { opacity:.5; pointer-events:none }
    .muted { color:var(--muted) }
    .footer { padding:12px 20px; border-top:1px solid var(--border); font-size:12px; color:var(--muted) }
    .notice { padding:16px 20px; border-top:1px solid var(--border) }
    .notice h2 { margin:0 0 10px; font-size:14px; color:var(--muted) }
    .notice-list { display:flex; flex-direction:column; gap:8px }
    .notice-item { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:12px }
    .notice-line { flex:1; min-width:0 }
    .notice-meta { white-space:nowrap; color:var(--muted); font-variant-numeric:tabular-nums }
    .status-dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(37,211,102,.2) }
    .actions { display:flex; gap:10px; align-items:center; justify-content:flex-end }
    .toggle { background:transparent; color:var(--text); border:1px solid var(--border); border-radius:999px; padding:8px 12px; cursor:pointer }
    .countdown { justify-self:center; font-weight:700; color:var(--green); background:rgba(37,211,102,.12); padding:6px 10px; border-radius:999px; border:1px solid var(--border); font-variant-numeric:tabular-nums }
    @media (max-width:480px){ header{grid-template-columns:1fr; gap:8px} .actions{justify-content:flex-start} }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23075E54'/%3E%3Cpath d='M18 50l2-8c-2-3-3-6-3-9 0-9 7-16 16-16s16 7 16 16-7 16-16 16c-3 0-6-1-9-2l-6 3z' fill='%2325D366'/%3E%3C/svg%3E">
</head>
<body>
  <header>
    <div class="brand">
      <h1>Juinor Eurovision Song Contest 2025</h1>
    </div>
    <div class="countdown" id="countdown">Countdown to Show — 00d 00:00:00</div>
    <div class="controls">
      <button id="themeToggle" class="toggle" aria-label="Toggle theme">Dark</button>
      <span class="tag">Filter:</span>
      <select id="companyFilter">
        <option value="__ALL__">All</option>
      </select>
      <div class="row">
        <span class="status-dot" id="liveDot"></span>
        <span class="muted" id="statusText">Live</span>
      </div>
    </div>
  </header>
  <main>
    <div class="grid" id="cards"></div>
  </main>
  <section class="notice">
    <h2>Notice</h2>
    <div id="noticeList" class="notice-list"></div>
  </section>
  <div class="footer">Data refreshes every 5 seconds — Powered by DEF Media Tv</div>

  <script>
    const SHEET_ID = "1AGQ4O3hfJgBBprfyAGy3wimK_zhcIQmAuKonnZaDboo";
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
    const GVIZ_NOTICE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=Sayfa2&tqx=out:json`;
    const state = { rows: [], filter: "__ALL__", lastHash: "" };
    const themePref = localStorage.getItem("theme") || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', themePref);

    function parseGviz(text) {
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}") + 1;
      const json = JSON.parse(text.slice(start, end));
      const labels = json.table.cols.map(c => (c.label || "").trim());
      const labelIndex = Object.fromEntries(labels.map((l,i)=>[l,i]));
      const expected = ["Dname","Dphone","Dmail","Drole","Dcompany","Acompany"];
      return json.table.rows.map(r => {
        function val(i){ const cell=r.c[i]; return cell ? (cell.v ?? "") : "" }
        const o={};
        expected.forEach((k,idx)=>{ const pos = labelIndex[k] !== undefined ? labelIndex[k] : idx; o[k] = val(pos) });
        return o;
      });
    }

    function parseGvizGeneric(text) {
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}") + 1;
      const json = JSON.parse(text.slice(start, end));
      const labels = json.table.cols.map((c,i) => (c.label && String(c.label).trim()) || `COL${i}`);
      return json.table.rows.map(r => {
        const o={};
        r.c.forEach((cell,i)=>{ o[labels[i]] = cell ? (cell.v ?? "") : "" });
        return o;
      });
    }

    function normalizePhone(raw) {
      const digits = String(raw || "").replace(/[^\d+]/g, "").replace(/^\+/, "");
      if (!digits) return "";
      if (digits.startsWith("90") && digits.length >= 12) return digits;
      if (digits.startsWith("0") && digits.length >= 11) return "90" + digits.slice(1);
      if (digits.length === 10) return "90" + digits;
      return digits;
    }

    function buildCard(person) {
      const name = person.Dname || "";
      const role = person.Drole || "";
      const mail = person.Dmail || "";
      const phoneRaw = person.Dphone || "";
      const company = person.Acompany || person.Dcompany || "";
      const phone = normalizePhone(phoneRaw);
      const waUrl = phone ? `https://wa.me/${phone}` : "";
      const btnDisabled = waUrl ? "" : "disabled";
      return `
        <div class=\"card\">
          <div class=\"top\">
            <div class=\"name\">${name}</div>
            <div class=\"company\">${company}</div>
          </div>
          <div class=\"role\">${role}</div>
          <div class=\"row\">\n            <span class=\"pill\">📞 ${phoneRaw || "-"}</span>\n            <span class=\"pill\">✉️ ${mail || "-"}</span>\n            <a class=\"btn alt\" href=\"${mail ? `mailto:${mail}` : "#"}\" ${mail ? "" : "aria-disabled=\"true\""}>Send Email</a>\n          </div>
          <div class=\"actions\">\n            <button class=\"btn\" ${btnDisabled} data-wa=\"${waUrl}\" data-name=\"${encodeURIComponent(name)}\">Open in WhatsApp</button>\n          </div>
        </div>
      `;
    }

    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }
    function formatDateTime(dt){ const d = new Date(dt); if(isNaN(d)) return new Date().toLocaleString('tr-TR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); return d.toLocaleString('tr-TR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) }
    function pickTimestamp(row){ const keys=['Timestamp','Date','Datetime','Tarih','Saat','CreatedAt','UpdatedAt','Created','Updated']; for(const k of keys){ if(row[k]) return row[k] } return Date.now() }
    function noticeLine(row){ const ignore=['Timestamp','Date','Datetime','Tarih','Saat','CreatedAt','UpdatedAt','Created','Updated']; return Object.entries(row).filter(([k,v])=>v && !ignore.includes(k)).map(([,v])=>String(v)).join(' — ') }
    function renderNotice(rows){
      const list = document.getElementById('noticeList');
      if(!list) return;
      const sorted = rows.map(r=>({row:r, ts: new Date(pickTimestamp(r)).getTime() || Date.now()})).sort((a,b)=>b.ts - a.ts);
      list.innerHTML = sorted.map(({row,ts}) => `<div class="notice-item"><div class="notice-line">${esc(noticeLine(row))}</div><div class="notice-meta">🕒 ${esc(formatDateTime(ts))}</div></div>`).join('');
    }

    function render() {
      const container = document.getElementById("cards");
      const rows = state.filter === "__ALL__" ? state.rows : state.rows.filter(r => (r.Acompany || r.Dcompany || "") === state.filter);
      container.innerHTML = rows.map(buildCard).join("");
      container.querySelectorAll(".btn").forEach(b => {
        b.addEventListener("click", () => {
          const url = b.getAttribute("data-wa");
          if (!url) return;
          window.open(url, "_blank", "noopener,noreferrer");
        });
      });
    }

    function updateFilterOptions() {
      const select = document.getElementById("companyFilter");
      const companies = Array.from(new Set(state.rows.map(r => r.Acompany || r.Dcompany).filter(Boolean))).sort((a,b)=>a.localeCompare(b));
      const prev = state.filter;
      const opts = [`<option value=\"__ALL__\">All</option>`].concat(companies.map(c => `<option value=\"${c}\">${c}</option>`)).join("");
      select.innerHTML = opts;
      if (companies.includes(prev) || prev === "__ALL__") { select.value = prev } else { select.value = "__ALL__"; state.filter = "__ALL__" }
    }

    function hashRows(rows) {
      return rows.map(r => [r.Dname,r.Dphone,r.Dmail,r.Drole,r.Acompany||r.Dcompany].join("|")).join("§");
    }

    async function load() {
      const statusText = document.getElementById("statusText");
      try {
        statusText.textContent = "Loading…";
        const res = await fetch(GVIZ_URL, { cache: "no-store" });
        const text = await res.text();
        const data = parseGviz(text);
        const h = hashRows(data);
        if (h !== state.lastHash) {
          state.rows = data;
          state.lastHash = h;
          updateFilterOptions();
          render();
        }
        statusText.textContent = "Live";
      } catch (e) {
        statusText.textContent = "Connection error";
      }
    }

    async function loadNotice(){
      try {
        const res = await fetch(GVIZ_NOTICE_URL, { cache: 'no-store' });
        const text = await res.text();
        const data = parseGvizGeneric(text);
        renderNotice(data);
      } catch(e) { /* silent */ }
    }

    document.getElementById("companyFilter").addEventListener("change", (e) => {
      state.filter = e.target.value;
      render();
    });

    function setToggleLabel(){ const t=document.documentElement.getAttribute('data-theme'); const btn=document.getElementById('themeToggle'); if(btn) btn.textContent = t==='light' ? 'Dark' : 'Light' }
    const targetDate = new Date('2025-12-13T00:00:00');
    function fmt(n){ return String(n).padStart(2,'0') }
    function updateCountdown(){
      const el = document.getElementById('countdown');
      if(!el) return;
      let diff = targetDate - new Date();
      if (diff <= 0) { el.textContent = 'Countdown to Show — 00d 00:00:00'; return }
      const d = Math.floor(diff/86400000);
      diff -= d*86400000;
      const h = Math.floor(diff/3600000);
      diff -= h*3600000;
      const m = Math.floor(diff/60000);
      diff -= m*60000;
      const s = Math.floor(diff/1000);
      el.textContent = `Countdown to Show — ${fmt(d)}d ${fmt(h)}:${fmt(m)}:${fmt(s)}`;
    }
    document.getElementById('themeToggle').addEventListener('click', ()=>{ const cur=document.documentElement.getAttribute('data-theme'); const next = cur==='light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', next); localStorage.setItem('theme', next); setToggleLabel() })
    setToggleLabel()
    updateCountdown();
    load();
    loadNotice();
    setInterval(load, 5000);
    setInterval(loadNotice, 5000);
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
